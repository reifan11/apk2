name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-ndk25b-v5-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-ndk25b-v5-

      - name: Add swap space
        run: |
          echo "Swap yang sudah ada:"
          sudo swapon --show || true
          free -h
          sudo fallocate -l 6G /swapfile_extra 2>/dev/null || \
            sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=6144
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Install system deps
        run: |
          sudo apt-get install -y -q \
            libtool libtool-bin libltdl-dev \
            libssl-dev libffi-dev zlib1g-dev \
            build-essential git zip unzip wget \
            autoconf automake pkg-config cmake \
            openjdk-17-jdk-headless

      - name: Install Python deps
        run: pip install "cython==3.0.2" buildozer

      - name: Patch buildozer.spec
        run: |
          python3 - <<'EOF'
          import pathlib, re
          spec = pathlib.Path("buildozer.spec")
          c = spec.read_text()
          c = re.sub(r'android\.ndk\s*=\s*\S+', 'android.ndk = 25b', c)
          if re.search(r'android\.archs\s*=', c):
              c = re.sub(r'android\.archs\s*=.*', 'android.archs = arm64-v8a', c)
          else:
              c += '\nandroid.archs = arm64-v8a\n'
          if 'warn_on_root' not in c:
              c += '\nwarn_on_root = 1\n'
          else:
              c = re.sub(r'warn_on_root\s*=\s*\d', 'warn_on_root = 1', c)
          c = '\n'.join(l for l in c.splitlines()
                        if 'add_gradle_maven_repos' not in l)

          # paksa p4a ke branch stabil, bukan develop (menghindari python versi terlalu baru/berat)
          lines = c.splitlines()
          new_lines, found = [], False
          for l in lines:
              if re.match(r'\s*#?\s*p4a\.branch\s*=', l):
                  new_lines.append('p4a.branch = master')
                  found = True
              else:
                  new_lines.append(l)
          c = '\n'.join(new_lines)
          if not found:
              c += '\np4a.branch = master\n'

          spec.write_text(c)
          ndk = re.search(r'android\.ndk\s*=\s*(\S+)', c)
          arch = re.search(r'android\.archs\s*=\s*(.+)', c)
          branch = re.search(r'p4a\.branch\s*=\s*(\S+)', c)
          print(f"✓ android.ndk = {ndk.group(1)}")
          print(f"✓ android.archs = {arch.group(1)}")
          print(f"✓ p4a.branch = {branch.group(1)}")
          EOF

      - name: Install SDK cmdline-tools
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE_DIR="$SDK_DIR/cmdline-tools/latest"
          mkdir -p "$CMDLINE_DIR"

          if [ -f "$CMDLINE_DIR/bin/sdkmanager" ]; then
            echo "✓ cmdline-tools sudah ada di cache"
          else
            echo "→ Download cmdline-tools..."
            wget -q --show-progress \
              -O /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-raw
            mv /tmp/cmdline-tools-raw/cmdline-tools/* "$CMDLINE_DIR/"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-raw
            echo "✓ sdkmanager siap"
          fi

          yes | "$CMDLINE_DIR/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CMDLINE_DIR/bin/sdkmanager" "platform-tools" > /dev/null

          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$CMDLINE_DIR/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager" || true

      - name: Pre-download NDK r25b
        run: |
          NDK_DIR="$HOME/.buildozer/android/platform"
          NDK_EXTRACTED="$NDK_DIR/android-ndk-r25b"
          mkdir -p "$NDK_DIR"
          if [ -d "$NDK_EXTRACTED" ]; then
            echo "✓ NDK r25b sudah ada di cache"
          else
            wget --tries=5 --retry-connrefused --waitretry=10 \
              -q --show-progress \
              -O "/tmp/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-r25b-linux.zip"
            unzip -q /tmp/ndk.zip -d "$NDK_DIR"
            rm /tmp/ndk.zip
            echo "✓ NDK siap: $NDK_EXTRACTED"
          fi

      - name: Start resource monitor
        run: |
          (while true; do
            { echo "=== $(date) ==="; free -h; echo "--- disk ---"; df -h /; echo; } >> monitor.log
            sleep 120
          done) &
          echo $! > monitor.pid

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDAPI: "33"
          ANDROIDMINAPI: "23"
        run: |
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT="$ANDROIDNDK"
          export ANDROID_NDK_HOME="$ANDROIDNDK"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          set -o pipefail
          timeout 4h python3 -m buildozer -v android debug 2>&1 | tee build.log

      - name: Stop resource monitor
        if: always()
        run: kill "$(cat monitor.pid)" 2>/dev/null || true

      - name: Upload diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            monitor.log
          retention-days: 3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifikiller-v6-apk
          path: bin/*.apk
          retention-days: 7
