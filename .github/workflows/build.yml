name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-ndk25b-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-ndk25b-v3-

      - name: Install system deps
        run: |
          sudo apt-get install -y -q \
            libtool libtool-bin libltdl-dev \
            libssl-dev libffi-dev zlib1g-dev \
            build-essential git zip unzip wget \
            autoconf automake pkg-config cmake \
            openjdk-17-jdk-headless

      - name: Install Python deps
        run: pip install "cython==3.0.2" buildozer

      - name: Patch buildozer.spec
        run: |
          python3 - <<'EOF'
          import pathlib, re
          spec = pathlib.Path("buildozer.spec")
          c = spec.read_text()
          c = re.sub(r'android\.ndk\s*=\s*\S+', 'android.ndk = 25b', c)
          if 'warn_on_root' not in c:
              c += '\nwarn_on_root = 1\n'
          else:
              c = re.sub(r'warn_on_root\s*=\s*\d', 'warn_on_root = 1', c)
          c = '\n'.join(l for l in c.splitlines()
                        if 'add_gradle_maven_repos' not in l)
          spec.write_text(c)
          ndk = re.search(r'android\.ndk\s*=\s*(\S+)', c)
          print(f"✓ android.ndk = {ndk.group(1)}")
          EOF

      - name: Install SDK cmdline-tools
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE_DIR="$SDK_DIR/cmdline-tools/latest"
          mkdir -p "$CMDLINE_DIR"

          if [ -f "$CMDLINE_DIR/bin/sdkmanager" ]; then
            echo "✓ cmdline-tools sudah ada di cache"
          else
            echo "→ Download cmdline-tools..."
            wget -q --show-progress \
              -O /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-raw
            mv /tmp/cmdline-tools-raw/cmdline-tools/* "$CMDLINE_DIR/"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-raw
            echo "✓ sdkmanager siap: $CMDLINE_DIR/bin/sdkmanager"
          fi

          yes | "$CMDLINE_DIR/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CMDLINE_DIR/bin/sdkmanager" "platform-tools" > /dev/null

          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$CMDLINE_DIR/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager" || true

      - name: Pre-download NDK r25b
        run: |
          NDK_DIR="$HOME/.buildozer/android/platform"
          NDK_EXTRACTED="$NDK_DIR/android-ndk-r25b"
          mkdir -p "$NDK_DIR"
          if [ -d "$NDK_EXTRACTED" ]; then
            echo "✓ NDK r25b sudah ada di cache"
          else
            echo "→ Download NDK r25b (~900 MB)..."
            wget --tries=5 --retry-connrefused --waitretry=10 \
              -q --show-progress \
              -O "/tmp/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-r25b-linux.zip"
            echo "→ Extracting..."
            unzip -q /tmp/ndk.zip -d "$NDK_DIR"
            rm /tmp/ndk.zip
            echo "✓ NDK siap: $NDK_EXTRACTED"
          fi

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDAPI: "33"
        run: |
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          python3 -m buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifikiller-v6-apk
          path: bin/*.apk
          retention-days: 7
